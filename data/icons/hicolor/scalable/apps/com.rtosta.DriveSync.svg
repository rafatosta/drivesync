<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254">
  <title>DriveSync</title>
  <desc>Vector reconstruction of the supplied DriveSync icon: blue drive, silver platter and white cloud with synchronization arrows.</desc>
  <defs>
    <linearGradient id="blue-base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#076cff"/><stop offset="1" stop-color="#0052ec"/>
    </linearGradient>
    <linearGradient id="metal-edge" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#aeb5c2"/><stop offset="0.55" stop-color="#b7beca"/><stop offset="1" stop-color="#cbd0da"/>
    </linearGradient>
    <linearGradient id="metal-top" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#e3e7ef"/><stop offset="0.5" stop-color="#dce0e8"/><stop offset="1" stop-color="#e1e5ed"/>
    </linearGradient>
    <linearGradient id="platter-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6dae2"/><stop offset="1" stop-color="#b5bbc7"/>
    </linearGradient>
    <radialGradient id="platter-top" cx=".42" cy=".37" r=".75">
      <stop offset="0" stop-color="#f0f2f6"/><stop offset="1" stop-color="#e4e8ee"/>
    </radialGradient>
    <linearGradient id="cloud-top" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#f7f8fa"/><stop offset="1" stop-color="#f3f5f8"/>
    </linearGradient>
    <linearGradient id="sync-blue" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#0068ff"/><stop offset="1" stop-color="#0058f1"/>
    </linearGradient>
    <linearGradient id="screw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#aab2bf"/><stop offset="1" stop-color="#b9c0cc"/>
    </linearGradient>
    <linearGradient id="led" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#92d900"/><stop offset="1" stop-color="#83d500"/>
    </linearGradient>
    <filter id="disk-shadow" x="-.2" y="-.2" width="1.4" height="1.5" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="cloud-shadow" x="-.15" y="-.15" width="1.35" height="1.45" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="10"/></filter>
    <g id="screw-head"><ellipse rx="32" ry="29" fill="#8e98a8"/><ellipse rx="21" ry="19" fill="url(#screw)"/></g>
    <path id="cloud-outline" d="M 634,558 C 548,558 478,492 477,409 C 476,330 541,265 625,264 C 650,198 711,155 780,155 C 852,155 914,199 932,264 C 999,268 1048,330 1048,405 C 1048,488 986,558 905,558 Z"/>
    <clipPath id="drive-clip"><path d="M 174,812 L 233,412 Q 244,330 329,330 H 887 Q 965,330 981,412 L 1048,810 Q 1060,906 979,907 H 248 Q 164,907 174,812 Z"/></clipPath>
  </defs>
  <g id="drive">
    <path id="base" fill="url(#blue-base)" d="M 171,824 H 1053 V 984 C 1053,1041 1011,1083 952,1083 H 272 C 212,1083 171,1040 171,983 Z"/>
    <path id="metal-rim" fill="url(#metal-edge)" d="M 174,812 L 233,412 Q 244,330 329,330 H 887 Q 965,330 981,412 L 1048,810 Q 1060,906 979,907 H 248 Q 164,907 174,812 Z"/>
    <path id="metal-face" fill="url(#metal-top)" stroke="#eff1f5" stroke-width="12" d="M 195,805 L 248,414 Q 259,348 329,348 H 885 Q 949,348 963,416 L 1027,805 Q 1039,873 975,873 H 251 Q 186,873 195,805 Z"/>
    <g id="screws">
      <use href="#screw-head" xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="#screw-head" transform="translate(339 410) scale(.99 .92)"/>
      <use href="#screw-head" xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="#screw-head" transform="translate(286 797)"/>
      <use href="#screw-head" xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="#screw-head" transform="translate(939 797)"/>
    </g>
    <g id="platter">
      <ellipse cx="593" cy="645" rx="246" ry="177" fill="#7e8796" opacity=".26" filter="url(#disk-shadow)"/>
      <ellipse cx="593" cy="645" rx="244" ry="175" fill="url(#platter-edge)" stroke="#a4abb7" stroke-width="3"/>
      <ellipse cx="593" cy="624" rx="239" ry="168" fill="url(#platter-top)" stroke="#f3f5f8" stroke-width="10"/>
      <g id="ds-monogram" fill="#b9c0cd" opacity=".29">
        <path d="M 484,581 C 512,574 552,572 579,584 C 610,597 616,617 595,635 C 571,654 531,660 474,659 L 512,585 Z M 536,587 L 507,644 C 542,645 565,636 577,622 C 592,604 573,587 536,587 Z" fill-rule="evenodd"/>
        <path d="M 710,614 L 695,626 C 679,614 655,611 644,620 C 631,631 650,636 667,643 C 697,654 706,666 695,683 C 682,703 653,708 620,700 C 584,692 542,667 485,696 C 517,669 555,663 589,674 C 622,684 651,694 668,680 C 682,668 660,659 641,652 C 615,642 608,629 622,615 C 641,597 682,598 710,614 Z"/>
      </g>
    </g>
    <rect id="status-slot" x="284" y="957" width="179" height="68" rx="34" fill="#f6f7fa"/>
    <circle id="power-led" cx="912" cy="991" r="37.5" fill="url(#led)"/>
  </g>
  <g id="cloud">
    <g clip-path="url(#drive-clip)"><use xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="#cloud-outline" transform="translate(0 12)" fill="#697181" opacity=".28" filter="url(#cloud-shadow)"/></g>
    <use xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="#cloud-outline" transform="translate(0 5)" fill="#a2aab8" stroke="#929aa8" stroke-width="11" stroke-linejoin="round"/>
    <use xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="#cloud-outline" fill="url(#cloud-top)" stroke="#aeb5c2" stroke-width="15" stroke-linejoin="round"/>
    <g id="sync-arrows" fill="url(#sync-blue)">
      <path id="sync-top" d="M 676,343 C 696,300 737,272 783,272 C 816,272 846,286 868,311 L 889,293 Q 896,286 904,292 Q 910,296 910,305 L 910,376 Q 910,392 894,389 L 829,370 Q 813,365 820,352 L 840,335 C 826,319 806,310 783,310 C 750,310 722,328 710,356 C 705,367 694,372 684,367 C 674,362 671,352 676,343 Z"/>
      <path id="sync-bottom" d="M 894,431 C 878,477 836,508 786,508 C 750,508 718,492 696,463 L 677,480 Q 669,487 661,481 Q 656,477 656,468 L 656,400 Q 656,383 672,386 L 738,404 Q 753,409 747,421 L 726,439 C 741,458 762,469 786,469 C 819,469 847,450 859,419 C 863,408 873,402 884,407 C 894,412 899,421 894,431 Z"/>
    </g>
  </g>
</svg>
