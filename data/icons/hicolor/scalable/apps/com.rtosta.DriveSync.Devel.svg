  <linearGradient id="folder" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#65ddff"/><stop offset=".53" stop-color="#168afa"/><stop offset="1" stop-color="#0650df"/></linearGradient>
  <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".66" stop-color="#f7fcff"/><stop offset="1" stop-color="#d4eaff"/></linearGradient>
