[package]
name = "drivesync-engine"
version = "0.1.0"
edition = "2021"
description = "DriveSync core engine facade and module contracts"
license = "GPL-3.0-only"

[lib]
name = "drivesync_engine"
path = "src/lib.rs"

[dependencies]
caseless = "0.2.2"
unicode-normalization = "0.1"
dbus = { version = "0.9", features = ["vendored"] }
oauth2 = { version = "5", default-features = false, features = ["timing-resistant-secret-traits"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
dbus-secret-service = { version = "4.1", features = ["crypto-rust", "vendored"] }
keyring = { version = "3.6", default-features = false, features = ["sync-secret-service", "crypto-rust", "vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
rusqlite = { version = "0.37", features = ["bundled"] }

rustix = { version = "1.1", features = ["fs"] }
md-5 = "0.10"
sha2 = "0.10"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
