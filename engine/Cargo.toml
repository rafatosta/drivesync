[package]
name = "drivesync-engine"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[lib]
name = "drivesync_engine"
path = "src/lib.rs"

[dependencies]
# Async HTTP client; rustls only, no default features (no cookies, proxy discovery disabled by the client).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
httpdate = "1"
base64 = "0.22"
sha2 = "0.10"
# Refuse symlinks and special files when opening private account metadata.
libc = "0.2"
tokio = { version = "1", features = ["fs", "io-util", "rt", "sync", "rt-multi-thread", "net", "time", "macros"] }
jsonwebtoken = "9.3"
# Private Accounts backend; all blocking D-Bus access runs on account workers.
secret-service = { version = "=4.0.0", features = ["rt-async-io-crypto-rust"] }

[features]
# Allows tests to point the Google provider at a local HTTP server.
# Never enabled in production builds.
test-endpoints = []

[dev-dependencies]
# Self dev-dependency: enables `test-endpoints` for unit and integration tests only.
drivesync-engine = { path = ".", features = ["test-endpoints"] }
tokio = { version = "1", features = ["rt", "macros", "time"] }
