# Development manifest for GNOME Builder. Not yet a reproducible release build.
app-id: com.rtosta.DriveSync.Devel
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: drivesync
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Per-account OAuth credentials in the desktop Secret Service.
  - --talk-name=org.freedesktop.secrets
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  # Temporary development-only access for Cargo to download crates.
  # Replace with flatpak-cargo-generator sources and offline builds.
  build-args:
    - --share=network
modules:
  - name: drivesync
    buildsystem: simple
    build-options:
      env:
        # Development uses the local testing OAuth client if present.
        # data/oauth/development.json is optional for UI-only builds.
        CARGO_HOME: /run/build/drivesync/cargo-home
        DRIVESYNC_APP_ID: com.rtosta.DriveSync.Devel
    build-commands:
      - cargo --version
      - cargo build --release --locked
      - install -Dm755 target/release/drivesync /app/bin/drivesync
      - install -Dm644 data/icons/hicolor/scalable/apps/com.rtosta.DriveSync.Devel.svg /app/share/icons/hicolor/scalable/apps/com.rtosta.DriveSync.Devel.svg
      - install -Dm644 data/com.rtosta.DriveSync.Devel.desktop /app/share/applications/com.rtosta.DriveSync.Devel.desktop
      - install -Dm644 data/com.rtosta.DriveSync.Devel.metainfo.xml /app/share/metainfo/com.rtosta.DriveSync.Devel.metainfo.xml
    sources:
      - type: dir
        path: ..
