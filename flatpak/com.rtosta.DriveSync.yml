# Production/Flathub candidate. Requires provisioned production OAuth
# client metadata; do not submit to Flathub before OAuth verification.
app-id: com.rtosta.DriveSync
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: drivesync
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Per-account OAuth credentials in the desktop Secret Service.
  - --talk-name=org.freedesktop.secrets
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  # Development build method; switch to vendored/offline Cargo sources
  # before submission to Flathub.
  build-args:
    - --share=network
modules:
  - name: drivesync
    buildsystem: simple
    build-options:
      env:
        # These are PUBLIC Desktop OAuth client metadata, not user tokens.
        # Provision this file before running the production build.
        CARGO_HOME: /run/build/drivesync/cargo-home
        DRIVESYNC_APP_ID: com.rtosta.DriveSync
        DRIVESYNC_BUILD_GOOGLE_OAUTH_FILE: data/oauth/production.json
        DRIVESYNC_REQUIRE_GOOGLE_OAUTH: '1'
    build-commands:
      - cargo --version
      - cargo build --release --locked
      - install -Dm755 target/release/drivesync /app/bin/drivesync
      - install -Dm644 data/icons/hicolor/scalable/apps/com.rtosta.DriveSync.Devel.svg /app/share/icons/hicolor/scalable/apps/com.rtosta.DriveSync.svg
      - install -Dm644 data/com.rtosta.DriveSync.desktop /app/share/applications/com.rtosta.DriveSync.desktop
      - install -Dm644 data/com.rtosta.DriveSync.metainfo.xml /app/share/metainfo/com.rtosta.DriveSync.metainfo.xml
    sources:
      - type: dir
        path: ..
